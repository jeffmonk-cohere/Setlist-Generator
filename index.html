<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Setlist Generator</title>
    <link rel="stylesheet" href="./styles.css?v=2026-05-06-setlist-only" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Setlist controls">
        <div class="brand-row">
          <div>
            <p class="eyebrow">Crowd-shaped</p>
            <h1>Setlist Generator</h1>
          </div>
          <button class="icon-button" id="newSongButton" type="button" title="New song" aria-label="New song">+</button>
        </div>

        <section class="generator-panel" aria-label="Setlist generator">
          <div class="section-heading">
            <h2>Crowd Read</h2>
            <span id="setMinutes">0 min</span>
          </div>

          <label class="control-group">
            <span>Room</span>
            <select id="venueSelect">
              <option value="mixed">Mixed room</option>
              <option value="listening">Listening room</option>
              <option value="bar">Bar crowd</option>
              <option value="dance">Dance floor</option>
              <option value="dinner">Dinner set</option>
            </select>
          </label>

          <div class="generator-grid">
            <label class="control-group">
              <span>Singalong</span>
              <input id="singalongInput" type="range" min="0" max="10" value="7" />
            </label>
            <label class="control-group">
              <span>Dance</span>
              <input id="danceInput" type="range" min="0" max="10" value="5" />
            </label>
            <label class="control-group">
              <span>Chill</span>
              <input id="chillInput" type="range" min="0" max="10" value="4" />
            </label>
            <label class="control-group">
              <span>Variety</span>
              <input id="varietyInput" type="range" min="0" max="10" value="6" />
            </label>
          </div>

          <div class="generator-actions">
            <label class="control-group">
              <span>Songs</span>
              <input id="setLengthInput" type="number" min="3" max="36" value="10" />
            </label>
            <button id="generateSetButton" type="button">Generate</button>
          </div>
          <p class="generator-note" id="generatorNote">Balanced opener, lift, breather, and closer.</p>
        </section>

        <section class="library-section">
          <div class="section-heading">
            <h2>Library</h2>
            <span id="songCount"></span>
          </div>
          <label class="search-box">
            <span>Search</span>
            <input id="searchInput" type="search" placeholder="Title, genre, mood..." />
          </label>
          <div class="song-list" id="songList"></div>
        </section>
      </aside>

      <main class="set-output">
        <header class="topbar">
          <div>
            <p class="eyebrow">Tonight</p>
            <h2>Generated Set List</h2>
          </div>
          <div class="top-actions">
            <button id="addToSetButton" type="button">Add Selected</button>
            <button id="copySetButton" type="button">Copy</button>
            <button id="exportSetButton" type="button">Export .txt</button>
            <button id="clearSetButton" type="button">Clear</button>
          </div>
        </header>

        <section class="set-summary" aria-label="Set summary">
          <div>
            <span>Songs</span>
            <strong id="setCount">0</strong>
          </div>
          <div>
            <span>Arc</span>
            <div class="set-arc" id="setArc" aria-label="Set energy arc"></div>
          </div>
        </section>

        <section class="setlist-section" aria-label="Generated set list">
          <div class="set-list output-list" id="setList"></div>
        </section>

        <section class="song-editor" aria-label="Song metadata">
          <div class="section-heading">
            <h2>Selected Song</h2>
            <span id="selectedHint"></span>
          </div>
          <div class="editor-grid">
            <label class="control-group">
              <span>Song</span>
              <input id="titleInput" aria-label="Song title" />
            </label>
            <label class="control-group">
              <span>Genre</span>
              <input id="genreInput" aria-label="Genre" />
            </label>
            <label class="control-group">
              <span>Mood</span>
              <input id="moodInput" aria-label="Mood" />
            </label>
            <label class="control-group">
              <span>Energy</span>
              <input id="energyInput" type="range" min="1" max="10" />
            </label>
            <label class="control-group">
              <span>Feel</span>
              <select id="feelSelect" aria-label="Song feel">
                <option value="anthem">Anthem</option>
                <option value="groove">Groove</option>
                <option value="ballad">Ballad</option>
                <option value="story">Story</option>
                <option value="wildcard">Wildcard</option>
              </select>
            </label>
            <label class="control-group">
              <span>Minutes</span>
              <input id="minutesInput" type="number" min="1" max="15" />
            </label>
            <label class="control-group wide">
              <span>Fit Tags</span>
              <input id="fitInput" aria-label="Song fit tags" placeholder="singalong, dance, closer" />
            </label>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js?v=2026-05-06-setlist-only"></script>
  </body>
</html>
